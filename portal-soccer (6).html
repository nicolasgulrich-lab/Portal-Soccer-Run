<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PORTAL SOCCER · One-Switch Adventure</title>
<style>
  :root{
    --navy:#0C2340;        /* Auburn navy */
    --orange:#E87722;      /* Auburn burnt orange */
    --neckar:#3E8E8C;      /* Neckar teal */
    --cream:#F5E9D0;
    --ink:#0a1020;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, #14305c 0%, var(--ink) 60%);
    color:var(--cream);
    font-family:"Courier New", ui-monospace, monospace;
    display:flex;flex-direction:column;align-items:center;gap:10px;
    min-height:100%;padding:14px;
  }
  h1{
    font-size:clamp(14px,2.6vw,22px);
    letter-spacing:.35em;text-transform:uppercase;
    color:var(--orange);
    text-shadow:0 0 0 var(--orange), 3px 3px 0 var(--navy);
    margin-top:4px;
  }
  h1 b{color:var(--neckar)}
  #wrap{
    width:min(96vw, 1000px);
    aspect-ratio:16/9;
    position:relative;
    border:4px solid var(--navy);
    outline:2px solid var(--orange);
    box-shadow:0 14px 50px rgba(0,0,0,.6);
    background:#000;
  }
  canvas{
    position:absolute;inset:0;width:100%;height:100%;
    image-rendering:pixelated;image-rendering:crisp-edges;
    cursor:pointer;
  }
  #bar{
    width:min(96vw, 1000px);
    display:flex;flex-wrap:wrap;gap:8px;align-items:center;
    background:rgba(12,35,64,.65);
    border:1px solid #24406e;
    padding:8px 10px;font-size:12px;
  }
  #bar label{opacity:.8;letter-spacing:.08em}
  #bar input{
    background:var(--ink);color:var(--cream);
    border:1px solid #2c4a7c;padding:6px 8px;width:180px;
    font-family:inherit;font-size:12px;
  }
  #bar button{
    background:var(--orange);color:var(--navy);border:0;
    padding:7px 14px;font-family:inherit;font-weight:bold;
    font-size:12px;letter-spacing:.1em;cursor:pointer;
  }
  #bar button:hover{filter:brightness(1.1)}
  #bar button:focus-visible, #bar input:focus-visible{outline:2px solid var(--cream);outline-offset:2px}
  #led{
    width:10px;height:10px;border-radius:50%;
    background:#7a2b2b;box-shadow:0 0 6px #7a2b2b;display:inline-block;
  }
  #led.on{background:#4be37a;box-shadow:0 0 10px #4be37a}
  #status{opacity:.85}
  .hint{opacity:.6;margin-left:auto;font-size:11px}
  @media (prefers-reduced-motion: reduce){ .shakeable{animation:none !important} }
</style>
</head>
<body>
<h1>Portal <b>⚽</b> Soccer</h1>

<div id="wrap"><canvas id="cv" width="960" height="540"></canvas></div>

<div id="bar">
  <span id="led"></span>
  <span id="status">Switch not connected</span>
  <label for="ip">ESP8266 IP</label>
  <input id="ip" value="192.168.4.1" spellcheck="false" aria-label="ESP8266 IP address">
  <button id="connect">Connect switch</button>
  <button id="music">♪ Music: ON</button>
  <span class="hint">Keyboard fallback: SPACE / click = the switch</span>
</div>

<script>
"use strict";
/* =====================================================================
   NECKAR → AUBURN — a 5-stage, one-switch hybrid game
   Input sources: ESP8266 via WebSocket ("P"), Space key, click/tap.
   ===================================================================== */
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const W = cv.width, H = cv.height;
ctx.imageSmoothingEnabled = false;

/* ---------------- palette ---------------- */
const PAL = {
  navy:"#0C2340", orange:"#E87722", neckar:"#3E8E8C", neckarDeep:"#2a6463",
  cream:"#F5E9D0", ink:"#0a1020", skin:"#e8b78a", skinDark:"#c08a5c",
  grass:"#4f8f3b", grassDark:"#3c6f2c", brick:"#a14e35", brickDark:"#7d3a27",
  white:"#ffffff", red:"#cf2e2e", green:"#1d6f42", argBlue:"#75AADB",
  hair:"#3b2a1d", portal:"#a85ce8", portal2:"#5ce8d8", police:"#274b8f",
  road:"#5a5a66", roadDark:"#46464f", sky1:"#aee3f2", sky2:"#fbd9a0",
};

/* ---------------- input ------------------ */
let ws = null;
const led = document.getElementById("led");
const statusEl = document.getElementById("status");

function setStatus(txt, on){ statusEl.textContent = txt; led.classList.toggle("on", !!on); }

document.getElementById("connect").addEventListener("click", () => {
  const ip = document.getElementById("ip").value.trim();
  try { if (ws) ws.close(); } catch(e){}
  setStatus("Connecting to " + ip + " …", false);
  try {
    ws = new WebSocket("ws://" + ip + ":81/");
    ws.onopen  = () => setStatus("Switch connected (" + ip + ")", true);
    ws.onclose = () => setStatus("Switch disconnected", false);
    ws.onerror = () => setStatus("Connection failed – check IP / Wi-Fi", false);
    ws.onmessage = (ev) => { if (String(ev.data).startsWith("P")) pressButton(); };
  } catch(e){ setStatus("Connection failed: " + e.message, false); }
});

window.addEventListener("keydown", e => {
  if (e.code === "Space"){ e.preventDefault(); pressButton(); }
});
cv.addEventListener("pointerdown", () => pressButton());

let game; // forward
function pressButton(){
  ensureAudio();
  if (game) game.onButton();
}

/* ---------------- audio (Web Audio synth) ---------------- */
let AC = null, crowdNode = null;
function ensureAudio(){
  if (!AC){
    AC = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (AC.state === "suspended") AC.resume();
  if (Music.on) startMusic();
}
function blip(freq=440, dur=0.09, type="square", vol=0.18, slide=0){
  if(!AC) return;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, AC.currentTime);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,freq+slide), AC.currentTime+dur);
  g.gain.setValueAtTime(vol, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime+dur);
  o.connect(g).connect(AC.destination);
  o.start(); o.stop(AC.currentTime+dur+0.02);
}
const sfx = {
  jump(){ blip(300,0.18,"square",0.16,+420); },
  pick(){ blip(660,0.08); blip(880,0.10,"square",0.16); },
  hit(){  blip(140,0.22,"sawtooth",0.22,-80); },
  lane(){ blip(500,0.06,"triangle",0.15,+150); },
  whistle(){ blip(2200,0.5,"sine",0.12,-50); },
  splash(){ noiseBurst(0.35,0.25,900); },
  eagle(){ blip(1500,0.4,"sawtooth",0.08,-900); },
  portal(){ blip(220,0.7,"sine",0.12,+660); blip(330,0.7,"sine",0.10,+880); },
  alarm(){ blip(880,0.15,"square",0.14,-300); setTimeout(()=>blip(880,0.15,"square",0.14,-300),200); },
  yell(){ blip(110,0.5,"sawtooth",0.25,+40); },
  kick(){ noiseBurst(0.08,0.3,300); blip(180,0.1,"square",0.2,-60); },
  save(){ blip(200,0.4,"sawtooth",0.2,-120); },
};
function noiseBurst(dur=0.3, vol=0.2, cutoff=1200){
  if(!AC) return;
  const len = AC.sampleRate*dur, buf = AC.createBuffer(1,len,AC.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i] = (Math.random()*2-1)*(1-i/len);
  const src = AC.createBufferSource(); src.buffer = buf;
  const f = AC.createBiquadFilter(); f.type="lowpass"; f.frequency.value=cutoff;
  const g = AC.createGain(); g.gain.value = vol;
  src.connect(f).connect(g).connect(AC.destination); src.start();
}
function crowdNoise(on){
  if(!AC) return;
  if (on && !crowdNode){
    const len = AC.sampleRate*2, buf = AC.createBuffer(1,len,AC.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    const src = AC.createBufferSource(); src.buffer=buf; src.loop=true;
    const f = AC.createBiquadFilter(); f.type="bandpass"; f.frequency.value=600; f.Q.value=0.4;
    const g = AC.createGain(); g.gain.value=0.05;
    src.connect(f).connect(g).connect(AC.destination); src.start();
    crowdNode = {src,g};
  } else if (!on && crowdNode){
    try{crowdNode.src.stop();}catch(e){}
    crowdNode = null;
  }
}
function goalShout(){
  // crowd swell
  if (AC && crowdNode) {
    crowdNode.g.gain.setValueAtTime(0.05, AC.currentTime);
    crowdNode.g.gain.linearRampToValueAtTime(0.22, AC.currentTime+0.4);
    crowdNode.g.gain.linearRampToValueAtTime(0.07, AC.currentTime+4);
  }
  try{
    const u = new SpeechSynthesisUtterance("Goooooooooooal!");
    u.rate = 0.75; u.pitch = 1.1; u.volume = 1;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------------- drawing helpers ---------------- */
function px(x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(x|0,y|0,w|0,h|0); }
function text(t,x,y,size=18,c=PAL.cream,align="center",bold=true){
  ctx.fillStyle=c; ctx.textAlign=align; ctx.textBaseline="middle";
  ctx.font=(bold?"bold ":"")+size+'px "Courier New", monospace';
  ctx.fillText(t,x,y);
}
function vignetteCard(title, sub, t){
  px(0,0,W,H,PAL.ink);
  const blink = Math.floor(t*2)%2===0;
  text(title, W/2, H/2-26, 34, PAL.orange);
  if (sub) text(sub, W/2, H/2+16, 16, PAL.cream);
  if (blink) text("● PRESS THE SWITCH ●", W/2, H/2+70, 14, PAL.neckar);
}

/* A blocky runner-person.
   opts: {naked, jersey:'arg'|'por'|null, frame, scale, facing(1|-1), pose:'run'|'stand'|'fall'|'sit'|'kick'} */
function drawPerson(x, y, o={}){
  const s = o.scale || 3;
  const f = o.facing || 1;
  const frame = o.frame|0;
  const pose = o.pose || "run";
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(f*s, s);
  // y is the FEET line; figure ~22px tall at scale 1
  const legSwing = pose==="run" ? [ [3,-2], [-2,3], [0,0], [-2,3] ][frame%4] : [0,0];
  // legs
  let legC = o.naked ? PAL.skin : (o.jersey ? (o.jersey==="arg" ? "#1c1c2e" : PAL.green) : "#33415c");
  if (pose==="sit"){
    px(-3,-6,3,6,legC); px(1,-6,3,6,legC);
  } else if (pose==="fall"){
    px(-4,-8,3,7,legC); px(2,-9,3,7,legC);
  } else if (pose==="kick"){
    px(-3,-9,3,9,legC); ctx.save(); ctx.translate(2,-9); ctx.rotate(-0.9); px(0,0,3,9,legC); ctx.restore();
  } else {
    px(-3+legSwing[0],-9,3,9,legC);
    px( 1+legSwing[1],-9,3,9,legC);
  }
  // torso
  const torsoY = pose==="sit" ? -14 : -18;
  if (o.naked){
    px(-4,torsoY,9,9,PAL.skin);
    // pixel censor mosaic over hips
    const mos = ["#888","#aaa","#777","#999"];
    for(let i=0;i<3;i++)for(let j=0;j<2;j++) px(-4+i*3, -10+j*2, 3,2, mos[(i+j+frame)%4]);
  } else if (o.jersey==="arg"){
    for(let i=0;i<3;i++){ px(-4+i*3,torsoY,3,9, i%2? PAL.white : PAL.argBlue); }
    px(-4,torsoY,9,2,PAL.argBlue);
  } else if (o.jersey==="por"){
    px(-4,torsoY,9,9,PAL.red);
    px(-4,torsoY,2,9,PAL.green); px(3,torsoY,2,9,PAL.green);
  } else {
    px(-4,torsoY,9,9,o.shirt||"#5c6f8a");
  }
  // arms
  const armC = o.naked ? PAL.skin : (o.jersey==="arg" ? PAL.argBlue : o.jersey==="por" ? PAL.red : (o.shirt||"#5c6f8a"));
  const armSwing = pose==="run" ? [ -2, 2, 0, 2 ][frame%4] : 0;
  if (pose==="fall"){ px(-7,torsoY-2,2,6,armC); px(6,torsoY-2,2,6,armC); }
  else { px(-6,torsoY+1+armSwing,2,6,armC); px(5,torsoY+1-armSwing,2,6,armC); }
  // hands
  // head
  px(-3,torsoY-7,7,7,PAL.skin);
  px(-3,torsoY-7,7,2,o.hair||PAL.hair);
  px(2,torsoY-4,1,1,PAL.ink); // eye
  ctx.restore();
}

function drawEagle(x,y,frame,scale=3){
  // smooth vector eagle: gradient body, feathered wings, fierce head
  const t = frame*0.5;
  const flap = Math.sin(t*2.2)*0.55;
  ctx.save(); ctx.translate(x,y); ctx.scale(scale*4.5, scale*4.5);
  ctx.lineJoin = "round";
  drawEagleWing(-0.2, -0.4, -1, flap*0.9, "#4a3826", "#5d4730");   // far wing
  ctx.fillStyle = "#5d4730";                                        // tail fan
  ctx.beginPath();
  ctx.moveTo(-2.2, 0.1);
  ctx.lineTo(-4.4, -0.9); ctx.lineTo(-4.6, -0.2); ctx.lineTo(-4.8, 0.6);
  ctx.lineTo(-4.4, 1.2);  ctx.closePath(); ctx.fill();
  let g = ctx.createLinearGradient(0,-1.2,0,1.4);                   // body
  g.addColorStop(0,"#6b5238"); g.addColorStop(0.6,"#4f3b26"); g.addColorStop(1,"#3a2b1b");
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.ellipse(-0.6, 0.15, 2.5, 1.05, -0.12, 0, 7); ctx.fill();
  drawEagleWing(0, -0.5, 1, flap, "#5d4730", "#7a5e3f");            // near wing
  ctx.strokeStyle = "#e8b23a"; ctx.lineWidth = 0.22;                // talons
  ctx.beginPath(); ctx.moveTo(0.2,1.0); ctx.lineTo(0.6,1.45); ctx.moveTo(0.7,1.0); ctx.lineTo(1.05,1.4); ctx.stroke();
  g = ctx.createLinearGradient(1.4,-1.2,2.6,0.4);                   // head
  g.addColorStop(0,"#ffffff"); g.addColorStop(1,"#d8d3c8");
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(1.0,-0.75);
  ctx.quadraticCurveTo(2.2,-1.35, 3.0,-0.85);
  ctx.quadraticCurveTo(3.25,-0.55, 3.05,-0.3);
  ctx.quadraticCurveTo(2.4,0.15, 1.35,0.35);
  ctx.quadraticCurveTo(0.9,-0.1, 1.0,-0.75);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#f0b429";                                        // hooked beak
  ctx.beginPath();
  ctx.moveTo(2.95,-0.9);
  ctx.quadraticCurveTo(3.85,-0.85, 3.9,-0.5);
  ctx.quadraticCurveTo(3.92,-0.18, 3.55,-0.28);
  ctx.quadraticCurveTo(3.3,-0.32, 3.0,-0.3);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#c98e1b";
  ctx.beginPath(); ctx.moveTo(3.55,-0.28); ctx.quadraticCurveTo(3.62,-0.12,3.4,-0.16); ctx.quadraticCurveTo(3.2,-0.25,3.0,-0.3); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#1c1208";                                        // eye
  ctx.beginPath(); ctx.arc(2.55,-0.72,0.13,0,7); ctx.fill();
  ctx.fillStyle = "#fff";
  ctx.beginPath(); ctx.arc(2.59,-0.76,0.045,0,7); ctx.fill();
  ctx.strokeStyle = "#3a2b1b"; ctx.lineWidth = 0.1;                 // fierce brow
  ctx.beginPath(); ctx.moveTo(2.25,-0.95); ctx.lineTo(2.85,-0.85); ctx.stroke();
  ctx.restore();
}
function drawEagleWing(ox, oy, side, flap, cDark, cLight){
  ctx.save(); ctx.translate(ox, oy); ctx.rotate(side===1 ? -flap : flap*0.8+0.35);
  const g = ctx.createLinearGradient(0,0,-0.5,-3);
  g.addColorStop(0,cLight); g.addColorStop(1,cDark);
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(0.6,0);
  ctx.quadraticCurveTo(0.4,-1.6, -0.9,-2.9);
  ctx.lineTo(-2.3,-2.75);
  ctx.quadraticCurveTo(-1.9,-2.3, -2.45,-2.15);
  ctx.quadraticCurveTo(-2.0,-1.75, -2.5,-1.55);
  ctx.quadraticCurveTo(-2.05,-1.2, -2.4,-0.95);
  ctx.quadraticCurveTo(-1.8,-0.6, -1.6,-0.15);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = "rgba(20,12,5,.35)"; ctx.lineWidth = 0.07;
  for(let i=0;i<3;i++){
    ctx.beginPath();
    ctx.moveTo(-0.3-i*0.45, -0.4-i*0.25);
    ctx.quadraticCurveTo(-1.2-i*0.4, -1.3-i*0.4, -2.1-i*0.12, -2.5+i*0.45);
    ctx.stroke();
  }
  ctx.restore();
}
function drawPolice(x,y,scale=3,frame=0){
  ctx.save(); ctx.translate(x,y); ctx.scale(scale,scale);
  px(-3,-9,3,9,"#1f2d4d"); px(1,-9,3,9,"#1f2d4d");      // legs
  px(-4,-18,9,9,PAL.police);                            // torso
  px(-1,-16,3,2,"#ffd34d");                             // badge
  const wave = (frame%2===0)? -2:0;
  px(5,-19+wave,2,7,PAL.police);                        // waving arm
  px(-6,-15,2,6,PAL.police);
  px(-3,-25,7,7,PAL.skin); px(-3,-25,7,2,PAL.police);   // head+cap
  px(-4,-24,9,1,PAL.navy);
  px(2,-22,1,1,PAL.ink);
  ctx.restore();
}

function drawShopOwner(x,y,scale=3,frame=0){
  ctx.save(); ctx.translate(x,y); ctx.scale(scale,scale);
  const swing = (frame%2===0)? 2:-2;
  px(-3+swing,-9,3,9,"#3d3d3d"); px(1-swing,-9,3,9,"#3d3d3d");
  px(-4,-18,9,9,PAL.orange);                            // shop apron
  px(-2,-15,5,4,PAL.navy);
  px(-6,-17,2,7,PAL.orange); px(5,-20,2,7,PAL.orange);  // arm raised (angry)
  px(-3,-25,7,7,PAL.skin); px(-3,-25,7,2,"#777");
  px(2,-22,1,1,PAL.ink);
  ctx.restore();
}

function drawPortal(x,y,r,t){
  for(let i=5;i>0;i--){
    ctx.beginPath();
    ctx.strokeStyle = i%2? PAL.portal : PAL.portal2;
    ctx.lineWidth = 4;
    const rr = r*(i/5) + Math.sin(t*6+i)*3;
    ctx.ellipse(x,y,rr,rr*0.45,t*0.6,0,Math.PI*2);
    ctx.stroke();
  }
  px(x-3,y-3,6,6,"#fff");
}

function drawCloud(x,y,s=1){
  ctx.fillStyle="rgba(255,255,255,.9)";
  ctx.fillRect(x,y,40*s,12*s); ctx.fillRect(x+8*s,y-8*s,26*s,10*s);
}

function tubingenBackdrop(t){
  // sky
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,PAL.sky1); g.addColorStop(1,PAL.sky2);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  drawCloud(120+Math.sin(t*.2)*10, 60); drawCloud(620+Math.cos(t*.15)*14, 95, 1.3);
  // hill + castle
  ctx.fillStyle="#7fae6b"; ctx.beginPath();
  ctx.moveTo(0,240); ctx.quadraticCurveTo(240,150,480,235); ctx.quadraticCurveTo(720,160,960,240);
  ctx.lineTo(960,320); ctx.lineTo(0,320); ctx.fill();
  px(380,150,90,55,"#cbb289"); px(370,140,20,65,"#b89c74"); px(460,140,20,65,"#b89c74");
  px(368,128,24,12,"#8a4b3a"); px(458,128,24,12,"#8a4b3a"); // castle Hohentübingen-ish
  // colourful old-town row (Neckarfront)
  const cols=["#d96b4f","#e8c25a","#7fa8d9","#d9869e","#9ad98a","#e8975a","#c0d96b"];
  for(let i=0;i<12;i++){
    const hx=i*82-10, hh=90+((i*37)%50);
    px(hx,300-hh,78,hh,cols[i%cols.length]);
    px(hx,300-hh-16,78,18,"#8a4b3a");                       // roof
    for(let wy=0;wy<3;wy++)for(let wx=0;wx<3;wx++)
      px(hx+10+wx*24, 300-hh+14+wy*26, 12,14, "#fdf6e0");
  }
  px(0,298,W,6,"#caa86f"); // quay wall
  // Neckar
  const wg=ctx.createLinearGradient(0,304,0,H);
  wg.addColorStop(0,PAL.neckar); wg.addColorStop(1,PAL.neckarDeep);
  ctx.fillStyle=wg; ctx.fillRect(0,304,W,H-304);
  ctx.strokeStyle="rgba(255,255,255,.25)"; ctx.lineWidth=2;
  for(let i=0;i<7;i++){
    ctx.beginPath();
    const yy=330+i*30;
    for(let x=0;x<=W;x+=20) ctx.lineTo(x, yy+Math.sin(t*2+x*.05+i)*3);
    ctx.stroke();
  }
}

function drawPuntBoat(x,y,t,withFriends=true,heroVisible=true,heroNaked=false,heroJersey=null){
  const bob=Math.sin(t*2)*3;
  ctx.save(); ctx.translate(x,y+bob);
  px(-130,0,260,18,"#6b4a2e"); px(-140,-4,20,10,"#5a3d25"); px(120,-4,20,10,"#5a3d25");
  px(-130,-2,260,4,"#7d5836");
  if (withFriends){
    drawPerson(-80,-2,{scale:2.4,shirt:"#b05050",pose:"sit"});
    drawPerson(-30,-2,{scale:2.4,shirt:"#5080b0",pose:"sit"});
    drawPerson( 70,-2,{scale:2.4,shirt:"#50a070",pose:"sit"});
    // punter standing with pole
    drawPerson(110,-4,{scale:2.6,shirt:"#8a6fb0",pose:"stand"});

/* ---------------- funny background music (chiptune sequencer) ---------------- */
const Music = { on:true, timer:null, next:0, step:0, gain:null };
function nFreq(n){ return n==null ? 0 : 440*Math.pow(2,(n-69)/12); } // MIDI note -> Hz
/* Three synth tracks. The intro tries to play "war-eagle.mp3" (put the real
   Auburn fight song file next to this HTML and it will be used); the bundled
   fallback is an ORIGINAL college-march pastiche, not the copyrighted tune. */
const TRACKS = {
  polka: { bpm:142, steps:32,
    melody:[76,null,79,null,72,null,79,null, 81,79,81,79,76,null,72,null,
            74,null,77,null,71,null,77,null, 79,77,76,74,72,null,67,null],
    bass:  [48,null,55,null,48,null,55,null, 53,null,60,null,55,null,62,null,
            50,null,57,null,43,null,55,null, 48,null,55,null,48,null,43,null] },
  march: { bpm:120, steps:32,   // proud brass-band style (original)
    melody:[60,null,64,null,67,67,64,67, 72,null,67,null,64,null,60,null,
            65,65,69,69,72,null,69,65, 67,67,71,71,74,72,67,null],
    bass:  [36,null,43,null,36,null,43,null, 41,null,48,null,43,null,36,null,
            41,null,48,null,41,null,48,null, 43,null,50,null,43,null,43,null] },
  chase: { bpm:168, steps:32,   // dramatic minor chase — bass locked to the melody
    melody:[69,null,72,null,76,null,81,null, 77,null,72,null,69,null,72,null,
            79,null,74,null,71,null,74,null, 81,null,76,null,72,null,69,null],
    bass:  [45,null,null,null,52,null,null,null, 41,null,null,null,48,null,null,null,
            43,null,null,null,50,null,null,null, 45,null,null,null,40,null,null,null] },
};
function musicMuted(){ return Music.mute.intro || Music.mute.drum || Music.mute.celebr; }
function musicTick(){
  if (!AC || !Music.on || musicMuted()){
    if (AC) Music.next = AC.currentTime + 0.05;   // pin: clean resume, no note pile-up
    return;
  }
  const tr = TRACKS[Music.track] || TRACKS.polka;
  const stepDur = 60/tr.bpm/2;
  while (Music.next < AC.currentTime + 0.12){
    const i = Music.step % tr.steps;
    const m = tr.melody[i], b = tr.bass[i];
    if (m!=null) playNote(nFreq(m), Music.next, stepDur*0.9, "square", Music.track==="chase"?0.06:0.055);
    if (b!=null) playNote(nFreq(b), Music.next, stepDur*0.95, "triangle", 0.06);
    if (Music.track==="chase"){ if (i%4===0) tickPerc(Music.next, i%8===0 ? 0.05 : 0.028); }
    else if (i%4===0) tickPerc(Music.next, i%8===0 ? 0.035 : 0.02);
    Music.next += stepDur; Music.step++;
  }
}
Music.track = "polka"; Music.mute = { intro:false, drum:false, celebr:false };
function setTrack(name){
  Music.track = name; Music.step = 0;
  if (AC) Music.next = AC.currentTime + 0.05;
}
/* --- optional real fight song: drop "war-eagle.mp3" next to this file --- */
const warEagleAudio = new Audio("war-eagle.mp3");
warEagleAudio.volume = 0.55;
let warEagleBroken = false;
warEagleAudio.addEventListener("error", ()=>{ warEagleBroken = true; });
warEagleAudio.addEventListener("ended", ()=>{ Music.mute.intro = false; setTrack("march"); });
function playIntroMusic(){
  if (!warEagleBroken){
    Music.mute.intro = true;
    warEagleAudio.currentTime = 0;
    const p = warEagleAudio.play();
    if (p) p.catch(()=>{ warEagleBroken = true; Music.mute.intro = false; setTrack("march"); });
  } else { setTrack("march"); }
}
function stopIntroMusic(){
  try{ warEagleAudio.pause(); }catch(e){}
  Music.mute.intro = false;
}

function playNote(freq, when, dur, type, vol){
  const o=AC.createOscillator(), g=AC.createGain();
  o.type=type; o.frequency.value=freq;
  g.gain.setValueAtTime(vol, when);
  g.gain.exponentialRampToValueAtTime(0.0001, when+dur);
  o.connect(g).connect(AC.destination);
  o.start(when); o.stop(when+dur+0.02);
}
function tickPerc(when, vol){
  const len=AC.sampleRate*0.04, buf=AC.createBuffer(1,len,AC.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
  const src=AC.createBufferSource(); src.buffer=buf;
  const f=AC.createBiquadFilter(); f.type="highpass"; f.frequency.value=4000;
  const g=AC.createGain(); g.gain.value=vol;
  src.connect(f).connect(g).connect(AC.destination); src.start(when);
}

/* --- penalty drum roll --- */
const Drum = { timer:null };
function startDrumRoll(){
  if (Drum.timer || !AC) return;
  Music.mute.drum = true;
  Drum.timer = setInterval(()=>{ if(AC) snare(AC.currentTime, 0.045); }, 46);
}
function stopDrumRoll(){
  if (Drum.timer){ clearInterval(Drum.timer); Drum.timer=null; }
  Music.mute.drum = false;
}
function snare(when, vol){
  const len=AC.sampleRate*0.05, buf=AC.createBuffer(1,len,AC.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
  const src=AC.createBufferSource(); src.buffer=buf;
  const f=AC.createBiquadFilter(); f.type="bandpass"; f.frequency.value=1900; f.Q.value=0.8;
  const g=AC.createGain(); g.gain.value=vol;
  src.connect(f).connect(g).connect(AC.destination); src.start(when);
}
function cymbal(){
  if(!AC) return;
  const len=AC.sampleRate*0.7, buf=AC.createBuffer(1,len,AC.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2);
  const src=AC.createBufferSource(); src.buffer=buf;
  const f=AC.createBiquadFilter(); f.type="highpass"; f.frequency.value=5500;
  const g=AC.createGain(); g.gain.value=0.16;
  src.connect(f).connect(g).connect(AC.destination); src.start();
}
function startMusic(){
  if (!AC || Music.timer) return;
  Music.next = AC.currentTime + 0.1; Music.step = 0;
  Music.timer = setInterval(musicTick, 30);
}
function stopMusic(){ if(Music.timer){clearInterval(Music.timer); Music.timer=null;} }
document.getElementById("music").addEventListener("click", function(){
  ensureAudio();
  Music.on = !Music.on;
  this.textContent = "♪ Music: " + (Music.on ? "ON" : "OFF");
  if (Music.on){
    startMusic();
    if (Music.mute.intro && !warEagleBroken){           // resume the fight song mid-intro
      const p = warEagleAudio.play(); if (p) p.catch(()=>{});
    }
  } else {
    stopMusic();
    try{ warEagleAudio.pause(); }catch(e){}             // OFF really means silence
  }
});

function sadTrombone(){ // wah wah wah waaaah
  if(!AC) return;
  const notes=[233,220,208,196], t0=AC.currentTime;
  notes.forEach((f,i)=>{
    const o=AC.createOscillator(), g=AC.createGain();
    o.type="sawtooth";
    const start=t0+i*0.42, dur=(i===3?1.4:0.38);
    o.frequency.setValueAtTime(f,start);
    o.frequency.linearRampToValueAtTime(f*0.93,start+dur); // droop
    g.gain.setValueAtTime(0.0001,start);
    g.gain.linearRampToValueAtTime(0.16,start+0.05);
    g.gain.exponentialRampToValueAtTime(0.0001,start+dur);
    o.connect(g).connect(AC.destination); o.start(start); o.stop(start+dur+0.05);
  });
}
function fanfare(){
  if(!AC) return;
  [[523,0],[659,0.14],[784,0.28],[1047,0.42]].forEach(([f,d])=>{
    playNote(f, AC.currentTime+d, d<0.4?0.16:0.8, "square", 0.12);
  });
}

function drawProfPhoto(img, t){
  if (!img.complete || !img.naturalWidth){ text("…", W/2, H/2, 30); return; }
  const maxH = 380, sc = Math.min(maxH/img.naturalHeight, 420/img.naturalWidth);
  const w = img.naturalWidth*sc, h = img.naturalHeight*sc;
  const x = W/2-w/2, y = 96+Math.sin(t*1.5)*4;
  ctx.save();
  ctx.translate(W/2, y+h/2); ctx.rotate(Math.sin(t*0.8)*0.02); ctx.translate(-W/2, -(y+h/2));
  px(x-12, y-12, w+24, h+24, PAL.cream);        // polaroid frame
  px(x-12, y+h+12, w+24, 26, PAL.cream);
  ctx.drawImage(img, x, y, w, h);
  ctx.restore();
}

/* =====================================================================
   GAME ENGINE — simple stage state machine
   ===================================================================== */
const Game = {
  stage:null, stageT:0, shake:0,
  setStage(s){ this.stage=s; this.stageT=0; if(s.enter) s.enter(); },
  onButton(){ if(this.stage && this.stage.onButton) this.stage.onButton(); },
  update(dt){
    this.stageT += dt;
    if (this.shake>0) this.shake = Math.max(0,this.shake-dt*8);
    if (this.stage && this.stage.update) this.stage.update(dt);
  },
  draw(){
    ctx.save();
    if (this.shake>0) ctx.translate((Math.random()-0.5)*this.shake*10,(Math.random()-0.5)*this.shake*10);
    if (this.stage && this.stage.draw) this.stage.draw();
    ctx.restore();
  }
};
game = Game;

function hud(label, timeLeft){
  px(0,0,W,34,"rgba(10,16,32,.75)");
  text(label, 14, 17, 15, PAL.orange, "left");
  if (timeLeft!=null){
    text("⏱ " + Math.ceil(timeLeft) + "s", W-14, 17, 15, PAL.cream, "right");
    // progress strip
    px(0,32,W,3,PAL.navy);
    px(0,32,W*(1-timeLeft/15),3,PAL.orange);
  }
}

/* =====================================================================
   STAGE 0 — TITLE
   ===================================================================== */
const TitleStage = {
  enter(){ crowdNoise(false); stopIntroMusic(); stopDrumRoll(); Music.mute.celebr=false; setTrack("polka"); },
  onButton(){ sfx.pick(); Game.setStage(IntroStage); },
  draw(){
    const t=Game.stageT;
    tubingenBackdrop(t);
    drawPuntBoat(W/2, 400, t);
    px(0,0,W,H,"rgba(10,16,32,.45)");
    text("PORTAL SOCCER", W/2, 150, 50, PAL.orange);
    text("a one-switch adventure in 5 stages", W/2, 196, 16, PAL.cream);
    if (Math.floor(t*2)%2===0) text("● PRESS THE SWITCH TO START ●", W/2, 300, 18, "#aef2c0");
    text("Connect your ESP8266 below — or use SPACE / click", W/2, 500, 13, "rgba(245,233,208,.8)");
  }
};

/* =====================================================================
   STAGE 1 — INTRO CUTSCENE (punt boat → eagle → splash → portal → Auburn)
   ===================================================================== */
const IntroStage = {
  phase:0, t:0, skipFlash:0,
  enter(){ this.phase=0; this.t=0; this.eaglePlayed=false; this.splashPlayed=false; this.portalPlayed=false;
           this.whistled=false; playIntroMusic(); },
  onButton(){ // the PLAYER turns the page — nothing auto-advances
    if (this.t < 0.35) return;                       // debounce double-presses
    sfx.pick();
    this.phase++; this.t = 0;
    if (this.phase >= 7){ stopIntroMusic(); Game.setStage(Stage2Card); }
  },
  update(dt){
    this.t += dt;                                    // timers only drive animations
  },
  draw(){
    const t=this.t, gt=Game.stageT;
    if (this.phase<=2){
      tubingenBackdrop(gt);
      if (this.phase===0){
        drawPuntBoat(W/2,400,gt);
        bubble(W/2-120, 330, "HAHA!"); if (gt%2>1) bubble(W/2+90, 320, "PROST!");
        caption("Tübingen. A perfect day on the Neckar…");
      }
      if (this.phase===1){
        drawPuntBoat(W/2,400,gt);
        if(!this.eaglePlayed){sfx.eagle(); this.eaglePlayed=true;}
        const p=Math.min(1,t/2.5);
        const ex = (W-60) + ((W/2+40)-(W-60))*p;   // dive from top-right toward the hero
        drawEagle(ex, 40+310*p, gt*8, 1.0+p*0.8);
        if (p>0.4) bubble(W/2+40, 320, "?!");
        caption("…until an EAGLE dives out of the sky!");
      }
      if (this.phase===2){
        drawPuntBoat(W/2,400,gt,true,false);
        if(!this.splashPlayed){sfx.splash(); this.splashPlayed=true;}
        const p=Math.min(1,t/1.2);
        drawPerson(W/2+20, 360+p*120, {scale:2.6, pose:"fall", shirt:"#e0c040"});
        // splash rings
        ctx.strokeStyle="rgba(255,255,255,.7)"; ctx.lineWidth=3;
        ctx.beginPath(); ctx.ellipse(W/2+20, 470, 30+p*40, 10+p*10,0,0,Math.PI*2); ctx.stroke();
        drawEagle(W/2-180, 120-t*60, gt*8, 1.0);
        caption("SPLASH! One friend goes overboard…");
      }
    }
    if (this.phase===3){ // underwater portal
      px(0,0,W,H,PAL.neckarDeep);
      ctx.fillStyle="rgba(255,255,255,.15)";
      for(let i=0;i<25;i++){ const bx=(i*157)%W, by=(H-((gt*60+i*70)%H)); ctx.beginPath(); ctx.arc(bx,by,4,0,7); ctx.fill(); }
      if(!this.portalPlayed){sfx.portal(); this.portalPlayed=true;}
      drawPortal(W/2, H/2+60, 90+Math.sin(gt*3)*6, gt);
      const p=Math.min(1,t/2.2);
      drawPerson(W/2, 120+p*(H/2-60), {scale:3, pose:"fall", shirt:"#e0c040"});
      caption("…and sinks straight into a glowing PORTAL.");
    }
    if (this.phase===4){ // Auburn campus
      auburnCampus(gt);
      drawPerson(W/2, 430, {scale:4, pose:"sit", naked:true, frame:(gt*4)|0});
      bubble(W/2+60, 320, "?! WHERE AM I…");
      bubble(W/2-180, 300, "…AND WHERE ARE MY CLOTHES?!");
      caption("Auburn University, Alabama. Slight problem: no clothes.");
    }
    if (this.phase===5){ // sees the police, gets scared
      auburnCampus(gt);
      const pw = Math.min(1, t/1.6);
      drawPolice(-60+pw*240, 460, 3.6, (t*6)|0);
      const shiver = (t>1.2) ? Math.sin(t*30)*2 : 0;
      drawPerson(W/2+60+shiver, 450, {scale:4, pose:"stand", naked:true, frame:(gt*4)|0, facing:-1});
      if (t>0.8)  bubble(180+pw*240, 350, "HEY!! YOU THERE!!");
      if (t>1.4){ bubble(W/2+90, 300, "!!!"); bubble(W/2+150, 340, "uh oh."); }
      caption("…and you have company. ARMED WITH A WHISTLE.");
      if (t>1.3 && !this.whistled){ this.whistled=true; sfx.whistle(); }
    }
    if (this.phase===6){ // the chase begins
      auburnCampus(gt);
      const p = Math.min(1, t/2.6);
      drawPerson(220+p*560, 455, {scale:3.8, naked:true, frame:(gt*12)|0});
      drawPolice(80+p*560, 460, 3.6, (gt*8)|0);
      bubble(140+p*560, 355, "STOP RIGHT THERE!!");
      bubble(280+p*560, 350, "NOPE NOPE NOPE");
      ctx.strokeStyle="rgba(10,16,32,.25)"; ctx.lineWidth=3;
      for(let i=0;i<5;i++){ const lx=60+p*560-i*30; ctx.beginPath(); ctx.moveTo(lx,420+i*12); ctx.lineTo(lx-26,420+i*12); ctx.stroke(); }
      caption("And so the chase begins…");
    }
    const ready=[2.2, 2.6, 1.4, 2.3, 2.2, 2.2, 2.7];
    if (this.t > (ready[this.phase] ?? 1)) pressPrompt();
  }
};

/* =====================================================================
   STAGE 2 — JUMP & RUN side-scroller (15 s, easy)
   ===================================================================== */
const Stage2 = {
  enter(){
    this.time=15; this.py=0; this.vy=0; this.onGround=true;
    this.obstacles=[]; this.spawnIn=1.6; this.speed=300; this.done=false; this.doneT=0;
    this.stumble=0; this.scroll=0; this.hits=0; this.caught=false;
    this.finishX=null; this.jumps=0;
    stopIntroMusic(); setTrack("chase");
  },
  onButton(){
    if (this.caught){ Game.setStage(Stage2); return; }   // redo the jump and run
    if (this.done){
      if (this.doneT>0.8){ sfx.pick(); Game.setStage(Stage3Card); }
      return;
    }
    if (this.onGround){ this.vy=-580; this.onGround=false; this.jumps=1; sfx.jump(); }
    else if (this.jumps===1){ this.vy=-580; this.jumps=2; sfx.jump(); }   // double tap = HIGH jump
  },
  update(dt){
    if (this.caught) return;
    if (this.done){
      this.doneT+=dt;                                    // waits for the player
      return;
    }
    this.scroll += this.speed*dt;
    this.time -= dt;
    if (this.time<=0 && this.finishX===null){   // 15 s over -> finish line rolls in
      this.time=0; this.finishX = W+80; this.obstacles.length=0;
    }
    if (this.finishX!==null){
      this.finishX -= this.speed*dt;
      if (this.finishX<=300){ this.done=true; this.doneT=0; sfx.pick(); setTrack("polka"); }
    }
    // physics
    this.vy += 1700*dt; this.py += this.vy*dt;
    if (this.py>=0){ this.py=0; this.vy=0; this.onGround=true; this.jumps=0; }
    // obstacles (easy: sparse, low)
    this.spawnIn -= dt;
    if (this.spawnIn<=0 && this.finishX===null && this.time>1.5){
      this.spawnIn = 1.5 + Math.random()*0.9;
      const isHigh = Math.random()<0.4;
      const pool = isHigh ? ["banner","wall"] : ["hedge","bench","cone"];
      this.obstacles.push({x:W+40, kind:pool[(Math.random()*pool.length)|0], high:isHigh});
    }
    const heroX=300;
    for(const o of this.obstacles){
      o.x -= this.speed*dt;
      const clearH = o.high ? 108 : 40;                // tall stuff needs the double jump
      if (!o.hit && Math.abs(o.x-heroX)<18 && this.py>-clearH){
        o.hit=true; this.stumble=0.6; Game.shake=1; sfx.hit();
        this.hits++;
        if (this.hits>=3){ this.caught=true; sfx.save(); sfx.whistle(); }
      }
    }
    this.obstacles = this.obstacles.filter(o=>o.x>-60);
    if (this.stumble>0) this.stumble-=dt;
  },
  draw(){
    const t=Game.stageT;
    auburnGroundScene(this.scroll, t);
    // static police officer on the left
    drawPolice(70, 470, 3.4, (t*5)|0);
    bubble(70, 372, "HEY! STOP!");
    // obstacles
    for(const o of this.obstacles) drawObstacle2(o);
    // finish line
    if (this.finishX!==null && !this.done) drawFinishLine2(this.finishX);
    // hero (hidden during the end scene — the shop-walk below draws him instead)
    const heroX=300;
    if (!this.done){
      drawPerson(heroX, 470+this.py, {scale:3.4, naked:true, frame:(t*10)|0, pose:this.onGround?"run":"fall"});
      if (this.stumble>0) bubble(heroX, 370+this.py, "OOF!");
    }
    // lives
    for(let i=0;i<3;i++) text(i<3-this.hits?"♥":"♡", 30+i*26, 56, 20, PAL.red, "left");
    if (this.caught){
      px(0,0,W,H,"rgba(10,16,32,.7)");
      drawPolice(W/2-90, H/2+60, 4, (t*5)|0);
      text("BUSTED BY CAMPUS POLICE!", W/2, H/2-40, 30, PAL.red);
      text("Press the switch to redo the jump and run", W/2, H/2+4, 16, PAL.cream);
    }
    if (this.done){
      // entering the fan shop
      const p=Math.min(1,this.doneT/3.8);
      px(0,0,W,H,"rgba(10,16,32,"+(p*0.25)+")");
      fanShopFront(W-330, 180);
      drawPerson(300+510*p, 470, {scale:3.4, naked:true, frame:(t*10)|0});
      caption2("Made it! You slip into the stadium FAN SHOP…");
      if (this.doneT>3.8) pressPrompt();
    } else {
      hud(this.finishX!==null ? "STAGE 2 · THERE'S THE FINISH LINE!!" : "STAGE 2 · TAP = JUMP · DOUBLE-TAP = HIGH JUMP", Math.max(0,this.time));
    }
  }
};

const Stage4Card = makeCard("STAGE 4 · CONCOURSE CHASE",
  "The owner is right behind you \u2014 and the concourse is full of your ARCH-RIVAL! Switch lanes, dodge for 15 s, 3 hits = caught!",
  ()=>Stage4);

const Stage4 = {
  enter(){
    this.time=15; this.lane=0; this.laneX=[W/2-130, W/2+130];
    this.obs=[]; this.spawnIn=1.0; this.hits=0; this.done=false; this.doneT=0;
    this.caught=false; this.z=0; this.finish=null;
    this.rival = (window.heroJersey==="por") ? "MESSI" : "RONALDO";
    setTrack("chase");
  },
  onButton(){
    if (this.caught){ Game.setStage(Stage4); return; }
    if (this.done){
      if (this.doneT>0.6){ sfx.pick(); Game.setStage(JordanHare); }
      return;
    }
    this.lane=1-this.lane; sfx.lane();
  },
  update(dt){
    if (this.caught) return;
    if (this.done){ this.doneT+=dt; return; }            // waits for the player
    this.z += dt*340;
    this.time-=dt;
    if (this.time<=0 && this.finish===null){    // 15 s over -> finish banner approaches
      this.time=0; this.finish={p:0}; this.obs.length=0;
    }
    if (this.finish){
      this.finish.p += dt/2.0;
      if (this.finish.p>=1){ this.done=true; this.doneT=0; sfx.pick(); setTrack("polka"); }
    }
    this.spawnIn-=dt;
    if (this.spawnIn<=0 && this.finish===null && this.time>1.5){
      this.spawnIn = 1.0+Math.random()*0.7;
      const kinds=["stand","slide","celebrate"];
      this.obs.push({p:0, lane:(Math.random()<0.5?0:1), kind:kinds[(Math.random()*kinds.length)|0], hit:false});
    }
    for(const o of this.obs){
      o.p += dt/2.4;             // 0 (far) → 1 (player)
      if (!o.hit && o.p>0.93 && o.p<1.02 && o.lane===this.lane){
        o.hit=true; this.hits++; Game.shake=1.4; sfx.hit();
        if (this.hits>=3){ this.caught=true; sfx.save(); }
      }
    }
    this.obs = this.obs.filter(o=>o.p<1.1);
  },
  draw(){
    const t=Game.stageT;
    // concourse: perspective corridor
    px(0,0,W,H,"#1b2233");
    px(0,0,W,180,"#232c44");
    // converging floor
    ctx.fillStyle=PAL.road;
    ctx.beginPath(); ctx.moveTo(W/2-60,180); ctx.lineTo(W/2+60,180); ctx.lineTo(W-40,H); ctx.lineTo(40,H); ctx.fill();
    ctx.strokeStyle="#7a7a8a"; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(W/2,180); ctx.lineTo(W/2,H); ctx.stroke(); // lane divider
    // moving floor stripes
    for(let i=0;i<6;i++){
      const p=((i/6)+(this.z/700))%1, y=180+p*p*(H-180);
      const half=60+(W/2-100)*p*p;
      px(W/2-half, y, half*2, 3+p*4, "rgba(255,255,255,.12)");
    }
    // side walls with banners
    ctx.fillStyle="#101626";
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(W/2-60,180); ctx.lineTo(40,H); ctx.lineTo(0,H); ctx.fill();
    ctx.beginPath(); ctx.moveTo(W,0); ctx.lineTo(W/2+60,180); ctx.lineTo(W-40,H); ctx.lineTo(W,H); ctx.fill();
    for(let i=0;i<5;i++){
      const p=((i/5)+(this.z/900))%1, y=190+p*p*(H-220), s=0.3+p;
      px(60-p*30, y, 40*s, 24*s, i%2?PAL.orange:PAL.navy);
      px(W-60-40*s+p*30, y, 40*s, 24*s, i%2?PAL.navy:PAL.orange);
    }
    text("STADIUM CONCOURSE →", W/2, 160, 14, "rgba(245,233,208,.5)");
    // obstacles far→near
    const sorted=[...this.obs].sort((a,b)=>a.p-b.p);
    for(const o of sorted) drawObstacle4(o, this.laneX, this.rival, t);
    // finish banner
    if (this.finish && !this.done) drawFinishLine4(this.finish.p);
    // hero (back view, near bottom)
    const hx = this.laneX[this.lane];
    drawPerson(hx, H-30, {scale:4, jersey:window.heroJersey||"arg", frame:(t*10)|0});
    // shop owner chasing at the very bottom edge
    drawShopOwner(hx + Math.sin(t*5)*30, H+34-(this.hits*16), 3.6, (t*8)|0);
    // hearts / hits
    for(let i=0;i<3;i++) text(i<3-this.hits?"♥":"♡", 30+i*26, 56, 20, PAL.red, "left");
    if (this.caught){
      px(0,0,W,H,"rgba(10,16,32,.7)");
      text("CAUGHT BY THE SHOP OWNER!", W/2, H/2-20, 30, PAL.red);
      text("Press the switch to try the chase again", W/2, H/2+24, 16, PAL.cream);
    } else if (this.done){
      px(0,0,W,H,"rgba(10,16,32,"+Math.min(0.6,this.doneT/2)+")");
      caption2("FINISH! You burst out of the concourse…");
      if (this.doneT>1.2) pressPrompt();
    } else {
      hud(this.finish ? ("STAGE 4 · FINISH AHEAD — past "+this.rival+"!") :
          ("STAGE 4 · DODGE "+this.rival+" — SWITCH LANES!"), Math.max(0,this.time));
    }
  }
};
function drawObstacle4(o, laneX, rival, t){
  const p=o.p, y=180+p*p*(H-200);
  const x = W/2 + (laneX[o.lane]-W/2)*(0.18+0.82*p);
  const s = 0.25+p*1.15;
  ctx.save(); ctx.translate(x,y); ctx.scale(s*3.4,s*3.4);
  drawRival(rival, o.kind, t);
  ctx.restore();
  if (o.hit){ text("\u2716", x, y-90*s, 30*Math.max(0.6,s), PAL.red); }
  if (p>0.25 && !o.hit) text(rival, x, y-78*s, Math.max(10, 13*s+4), PAL.cream);
}
function rivalFace(arg, cx, cy){
  const img = arg ? messiFaceImg : ronaldoFaceImg;
  const d = 12;
  if (img.complete && img.naturalWidth){
    ctx.drawImage(img, cx-d/2, cy-d/2, d, d);
  } else {
    px(cx-3.5, cy-3.5, 7, 7, arg ? PAL.skin : "#d9a06a");
  }
}
function drawRival(rival, kind, t){
  // pixel caricature; MESSI = Argentina kit #10, RONALDO = Portugal kit #7
  const arg = rival==="MESSI";
  const shirt1 = arg ? PAL.argBlue : PAL.red, shirt2 = arg ? PAL.white : PAL.green;
  const shorts = arg ? "#1c1c2e" : PAL.green;
  const skin = arg ? PAL.skin : "#d9a06a";
  const hair = arg ? "#4a2f1d" : "#1a1a1a";
  if (kind==="slide"){            // sliding tackle
    ctx.save(); ctx.rotate(-0.18);
    px(-12,-6,12,4,shorts); px(0,-7,14,4,skin);
    px(-13,-14,10,9, shirt1);
    if (arg){ px(-10,-14,3,9,shirt2); px(-6,-14,3,9,shirt1);}
    px(-16,-18,4,7,skin);
    rivalFace(arg, -11.5, -20);
    ctx.restore();
    text("\u26A1",10,-18,8,"#ffd34d");
  } else if (kind==="celebrate"){ // arms up high
    px(-3,-9,3,9,skin); px(1,-9,3,9,skin);
    px(-2,-11,5,3,shorts);
    px(-4,-19,9,9,shirt1);
    if (arg){ px(-4,-19,3,9,shirt2); px(2,-19,3,9,shirt2); }
    text(arg?"10":"7", 0.5,-14.5, 6, arg?"#1c1c2e":PAL.white);
    px(-7,-26,3,8,skin); px(5,-26,3,8,skin);
    rivalFace(arg, 0.5, -24);
  } else {                        // standing wall, arms crossed
    px(-3,-9,3,9,skin); px(1,-9,3,9,skin);
    px(-3,-11,7,3,shorts);
    px(-4,-19,9,9,shirt1);
    if (arg){ px(-4,-19,3,9,shirt2); px(2,-19,3,9,shirt2); }
    text(arg?"10":"7", 0.5,-14.5, 6, arg?"#1c1c2e":PAL.white);
    px(-5,-17,11,3,skin);
    rivalFace(arg, 0.5, -24);
  }
}
function drawFinishLine4(p){
  const y=180+p*p*(H-200), half=60+(W/2-100)*p*p, sc=0.3+p;
  const cell = Math.max(6, 16*sc);
  for(let r=0;r<2;r++)
    for(let cx=-half; cx<half; cx+=cell)
      px(W/2+cx, y+r*cell*0.5, cell, cell*0.5, ((cx/cell|0)+r)%2 ? "#111" : "#fff");
  px(W/2-half, y-150*sc, half*2, 26*sc, PAL.navy);
  text("FINISH", W/2, y-137*sc, Math.max(10,18*sc), PAL.orange);
  px(W/2-half, y-150*sc, 6*sc, 150*sc, "#cfcfcf");
  px(W/2+half-6*sc, y-150*sc, 6*sc, 150*sc, "#cfcfcf");
}


/* =====================================================================
   TRANSITION — entering Jordan-Hare Stadium
   ===================================================================== */
const JordanHare = {
  enter(){ this.t=0; setTrack("march"); crowdNoise(true); },
  onButton(){
    if (this.t<0.5) return;
    sfx.pick(); crowdNoise(false); Game.setStage(Stage5Card);
  },
  update(dt){ this.t+=dt; },                             // waits for the player
  draw(){
    const t=this.t, gt=Game.stageT;
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,"#2b3a66"); g.addColorStop(0.6,"#e8884f"); g.addColorStop(1,"#f5c97a");
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    px(60,170,W-120,250,"#7d6a55");
    px(40,160,W-80,24,"#695843");
    for(let i=0;i<16;i++) px(80+i*52,200,30,180,"#5d4d3a");
    for(let i=0;i<16;i++){ ctx.fillStyle="#3a2f22"; ctx.beginPath(); ctx.arc(95+i*52,210,15,Math.PI,0); ctx.fill(); }
    for(const lx of [120, W-120]){
      px(lx-4,40,8,130,"#444");
      px(lx-26,28,52,18,"#222");
      for(let i=0;i<4;i++) px(lx-22+i*12, 32, 8,10, "#fff7c0");
      ctx.fillStyle="rgba(255,247,192,.12)";
      ctx.beginPath(); ctx.moveTo(lx,46); ctx.lineTo(lx-120,H); ctx.lineTo(lx+120,H); ctx.fill();
    }
    px(W/2-260,96,520,52,PAL.navy); px(W/2-260,90,520,8,PAL.orange);
    text("JORDAN-HARE STADIUM", W/2, 122, 26, PAL.orange);
    text("HOME OF THE AUBURN TIGERS", W/2, 162, 13, PAL.cream);
    px(W/2-55,300,110,120,"#241c12");
    px(W/2-55,294,110,8,PAL.orange);
    text("GATE 9", W/2, 290, 13, PAL.cream);
    px(0,420,W,H-420,"#caa86f");
    const p=Math.min(1,t/3.2);
    const hx=80+(W/2-80)*p;
    const sc=3.6-1.5*p;
    if (p<0.99) drawPerson(hx, 430, {scale:sc, jersey:window.heroJersey||"arg", frame:(gt*12)|0});
    if (t>0.6 && t<3.0) bubble(hx, 430-90*(sc/3.6), "THE STADIUM!");
    if (Math.floor(gt*2)%2===0) text("\u266A the crowd is already roaring \u266A", W/2, 460, 14, "rgba(12,35,64,.8)");
    caption2(t<3.2 ? "You sprint straight through the players\u2019 entrance of Jordan-Hare\u2026" :
                     "\u2026and stumble right into the LOCKER ROOM.");
    if (t>3.4) pressPrompt();
  }
};

/* =====================================================================
   STAGE 5 — LOCKER ROOM, COACH, PENALTY SHOOT-OUT
   ===================================================================== */
const Stage5Card = makeCard("STAGE 5 · THE BIG MOMENT",
  "The coach thinks you're the new striker. One penalty decides EVERYTHING.",
  ()=>Stage5Coach);

const Stage5Coach = {
  enter(){ this.t=0; this.yelled=false; setTrack("march"); },
  onButton(){ if (this.t>0.5){ sfx.pick(); Game.setStage(Stage5Walk); } },
  update(dt){
    this.t+=dt;
    if (this.t>0.6 && !this.yelled){ this.yelled=true; sfx.yell(); Game.shake=1.5; }
  },
  draw(){
    const t=Game.stageT;
    // locker room
    px(0,0,W,H,"#2a3140");
    for(let i=0;i<8;i++){ px(30+i*116,90,100,260,"#3c4659"); px(40+i*116,100,80,8,"#566480"); px(64+i*116,210,10,10,"#8896b0"); }
    px(0,400,W,H-400,"#222a38");
    px(120,420,W-240,90,"#4a3a2a"); // bench
    // coach (big, red-faced)
    ctx.save(); ctx.translate(250,470); ctx.scale(5,5);
    px(-3,-9,3,9,"#23304a"); px(1,-9,3,9,"#23304a");
    px(-5,-19,11,10,PAL.navy); px(-2,-16,5,3,PAL.orange);
    const arm=(Math.floor(t*6)%2)?-3:0;
    px(-8,-18+arm,3,8,PAL.navy); px(6,-18-arm,3,8,PAL.navy);
    px(-3,-26,7,7,this.yelled?"#e87a6a":PAL.skin); px(-3,-26,7,2,"#999");
    px(2,-23,1,1,PAL.ink); px(-1,-21,4,2,"#7a2020");
    ctx.restore();
    // hero
    drawPerson(620, 470, {scale:3.6, jersey:window.heroJersey||"arg", pose:"stand"});
    if (this.yelled){
      const sh=Math.floor(t*8)%2;
      bubble(430, 230+(sh?3:0), "GET YOUR HEAD");
      bubble(430, 270+(sh?-3:0), "IN THE F***ING GAME!!!");
      bubble(640, 350, "…yes coach?!");
    }
    caption2("He thinks you're the new signing. There is no way out of this.");
    if (this.t>2.2) pressPrompt();
  }
};

const Stage5Walk = {
  enter(){ this.t=0; crowdNoise(true); },
  onButton(){ if (this.t>0.5){ sfx.pick(); Game.setStage(Penalty); } },
  update(dt){ this.t+=dt; },                             // waits for the player
  draw(){
    const t=this.t;
    // tunnel into stadium
    px(0,0,W,H,"#11182a");
    const p=Math.min(1,t/3.4);
    // light at the end
    const r=60+p*420;
    const g=ctx.createRadialGradient(W/2,H/2,10,W/2,H/2,r);
    g.addColorStop(0,"#dff3ff"); g.addColorStop(0.7,"#74b3d8"); g.addColorStop(1,"#11182a");
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(W/2,H/2,r,0,7); ctx.fill();
    drawPerson(W/2, 500, {scale:4-p*1.6, jersey:window.heroJersey||"arg", frame:(t*8)|0, facing:1});
    caption2("The crowd roars. Your legs walk you onto the pitch…");
    if (this.t>3.4) pressPrompt();
  }
};


function drawKeeperFigure(gx, gy, t){
  const sway = Math.sin(t*1.4)*3;
  const bob  = Math.sin(t*2.8)*2;
  ctx.save(); ctx.translate(gx+sway, gy);
  ctx.fillStyle="rgba(0,0,0,.25)";
  ctx.beginPath(); ctx.ellipse(0,2,44,8,0,0,7); ctx.fill();          // shadow
  // legs: shorts, knees, long keeper socks, boots
  px(-22,-66,44,20,"#15151c");
  px(-18,-50,12,16,"#e8b78a"); px(6,-50,12,16,"#e8b78a");
  px(-19,-34,14,26,"#0c8a3e"); px(5,-34,14,26,"#0c8a3e");
  px(-24,-8,20,8,"#111"); px(4,-8,20,8,"#111");
  px(-26,-2,22,3,"#fff");  px(4,-2,22,3,"#fff");
  // graphical torso: golden keeper jersey, navy trim, number 1
  px(-26,-118+bob,52,52,"#caa92c");
  px(-26,-118+bob,52,6,PAL.navy);
  px(-26,-70+bob,52,4,PAL.navy);
  text("1", 0, -92+bob, 24, PAL.navy);
  // SHORT arms with gloves
  const armY = -102+bob, flap = Math.sin(t*2.2)*5;
  ctx.fillStyle="#caa92c";
  ctx.save(); ctx.translate(-24,armY); ctx.rotate(-0.3); ctx.fillRect(-40,-7,40,14); ctx.restore();
  ctx.save(); ctx.translate(24,armY);  ctx.rotate(0.3);  ctx.fillRect(0,-7,40,14);  ctx.restore();
  px(-76,armY-26+flap,22,24,"#0c8a3e"); px(-76,armY-26+flap,22,5,"#fff");   // left glove
  px(54,armY-26-flap,22,24,"#0c8a3e");  px(54,armY-26-flap,22,5,"#fff");    // right glove
  // photo head (circular crop) on the graphical body
  if (keeperHeadImg.complete && keeperHeadImg.naturalWidth){
    const d = 58;
    ctx.save();
    ctx.translate(0, -118+bob-d/2+8);
    ctx.rotate(Math.sin(t*1.4)*0.05);
    ctx.drawImage(keeperHeadImg, -d/2, -d/2, d, d);
    ctx.restore();
  } else {
    px(-14,-146+bob,28,28,PAL.skin);
  }
  ctx.restore();
}

const Penalty = {
  enter(){ this.t=0; this.arrow=0; this.state="aim"; this.ball={x:W/2,y:470}; this.shotT=0; this.targetX=0; crowdNoise(true); startDrumRoll(); },
  onButton(){
    if (this.state==="aim"){
      this.state="shot"; this.shotT=0;
      this.targetX = W/2 + Math.sin(this.t*2.4)*250;  // same formula as arrow
      stopDrumRoll(); Music.mute.celebr=true;         // stay silent until the verdict
      sfx.kick();
    } else if (this.state==="goal" && this.t>2.5){
      Game.setStage(ProfWin);
    } else if (this.state==="saved" && this.t>2.0){
      Game.setStage(ProfLose); // -> then the game starts over
    }
  },
  update(dt){
    this.t+=dt;
    if (this.state==="saved" && this.t>3.5){ Game.setStage(ProfLose); return; }
    if (this.state==="goal" && this.t>5.0){ Game.setStage(ProfWin); return; }
    if (this.state==="shot"){
      this.shotT+=dt;
      const p=Math.min(1,this.shotT/0.55);
      this.ball.x = W/2 + (this.targetX-W/2)*p;
      this.ball.y = 470 - 230*p + 40*p*p;
      if (p>=1){
        const saved = Math.abs(this.targetX - W/2) < 75; // keeper reach (matches the shorter arms)
        if (saved){ this.state="saved"; this.t=0; Music.mute.celebr=true; cymbal(); sfx.save(); sfx.whistle(); }
        else { this.state="goal"; this.t=0; Music.mute.celebr=true; cymbal(); goalShout(); }
      }
    }
  },
  draw(){
    const t=Game.stageT;
    // stadium pitch
    const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,"#0f1a30"); g.addColorStop(0.4,"#16233e");
    ctx.fillStyle=g; ctx.fillRect(0,0,W,160);
    // crowd dots
    for(let i=0;i<300;i++){ px((i*53)%W, 20+((i*29)%120), 3,3, ["#ffd","#fda","#adf","#fad"][i%4]); }
    px(0,160,W,H-160,PAL.grass);
    for(let i=0;i<6;i++) px(0,160+i*64,W,32, i%2?PAL.grass:"#46832f");
    // goal
    const gx=W/2, gw=560, gh=170, gy=330;
    ctx.strokeStyle=PAL.white; ctx.lineWidth=8;
    ctx.strokeRect(gx-gw/2, gy-gh, gw, gh);
    ctx.lineWidth=1; ctx.strokeStyle="rgba(255,255,255,.35)";
    for(let i=1;i<14;i++){ ctx.beginPath(); ctx.moveTo(gx-gw/2+i*gw/14, gy-gh); ctx.lineTo(gx-gw/2+i*gw/14, gy); ctx.stroke(); }
    for(let i=1;i<5;i++){ ctx.beginPath(); ctx.moveTo(gx-gw/2, gy-gh+i*gh/5); ctx.lineTo(gx+gw/2, gy-gh+i*gh/5); ctx.stroke(); }
    // keeper = photo torso on a drawn figurine body
    drawKeeperFigure(gx, gy, t);
    if (this.state==="aim"){
      // sweeping arrow above the goal line
      const ax = W/2 + Math.sin(this.t*2.4)*250;
      ctx.fillStyle=PAL.orange;
      ctx.beginPath(); ctx.moveTo(ax, 250); ctx.lineTo(ax-16, 222); ctx.lineTo(ax+16, 222); ctx.fill();
      px(ax-4, 196, 8, 26, PAL.orange);
      text("AIM", ax, 184, 14, PAL.orange);
    }
    if (this.state==="goal"){
      drawPortal(this.targetX, gy-70, 60+Math.sin(t*4)*5, t);
      text("⚽ GOOOOOOAL! ⚽", W/2, 110, 44, PAL.orange);
      if (this.t>2.5) text("Press the switch…", W/2, 150, 16, PAL.cream);
    }
    if (this.state==="saved"){
      text("SAVED BY THE KEEPER!", W/2, 110, 38, PAL.red);
      if (Math.floor(t*3)%2===0) bubble(W/2, 250, "NOT TODAY!");
      text("The dream collapses… the whole journey starts over.", W/2, 150, 16, PAL.cream);
      if (this.t>2.0) text("● PRESS THE SWITCH ●", W/2, 190, 15, PAL.neckar);
    }
    // ball
    const b=this.ball;
    ctx.fillStyle=PAL.white; ctx.beginPath(); ctx.arc(b.x,b.y,13,0,7); ctx.fill();
    ctx.fillStyle=PAL.ink; ctx.beginPath(); ctx.arc(b.x-3,b.y-3,4,0,7); ctx.fill();
    // shooter
    drawPerson(W/2-40, 510, {scale:3.6, jersey:window.heroJersey||"arg", pose:this.state==="aim"?"stand":"kick"});
    if (this.state==="aim") hud("STAGE 5 · PENALTY — press to SHOOT where the arrow points!", null);
  }
};


/* =====================================================================
   PROFESSOR VERDICT SCREENS
   ===================================================================== */
const ProfLose = {
  enter(){ this.t=0; crowdNoise(false); stopDrumRoll(); stopMusic(); Music.mute.celebr=false; sadTrombone(); },
  onButton(){ if(this.t>1.2){ if(Music.on) startMusic(); Game.setStage(TitleStage); } },
  update(dt){ this.t+=dt; },
  draw(){
    const t=Game.stageT;
    px(0,0,W,H,"#1a1020");
    // rain of disappointment
    ctx.strokeStyle="rgba(120,140,200,.25)"; ctx.lineWidth=2;
    for(let i=0;i<40;i++){
      const rx=(i*97)%W, ry=((t*420+i*123)%(H+40))-20;
      ctx.beginPath(); ctx.moveTo(rx,ry); ctx.lineTo(rx-4,ry+16); ctx.stroke();
    }
    drawProfPhoto(profLoseImg, t);
    text("YOUR PROFESSOR IS", W/2, 36, 26, PAL.red);
    text("DISAPPOINTED IN YOU…", W/2, 66, 26, PAL.red);
    if (this.t>1.2 && Math.floor(t*2)%2===0)
      text("● PRESS THE SWITCH — the whole journey starts over ●", W/2, H-26, 15, PAL.cream);
  }
};
const ProfWin = {
  enter(){ this.t=0; fanfare(); this.confetti=[];
    for(let i=0;i<120;i++) this.confetti.push({x:Math.random()*W, y:-Math.random()*H,
      v:60+Math.random()*120, c:[PAL.orange,PAL.neckar,PAL.argBlue,PAL.red,"#ffd34d"][i%5], r:Math.random()*7});
  },
  onButton(){ if(this.t>1.0) Game.setStage(Ending); },
  update(dt){ this.t+=dt; for(const c of this.confetti){ c.y+=c.v*dt; if(c.y>H+10){c.y=-10; c.x=Math.random()*W;} } },
  draw(){
    const t=Game.stageT;
    px(0,0,W,H,"#10262e");
    drawProfPhoto(profWinImg, t);
    for(const c of this.confetti) px(c.x+Math.sin(t*3+c.r)*8, c.y, 6,6, c.c);
    text("YOUR PROFESSOR IS", W/2, 36, 26, "#4be37a");
    text("SO PROUD OF YOU!", W/2, 66, 28, "#4be37a");
    if (this.t>1.0 && Math.floor(t*2)%2===0)
      text("● PRESS THE SWITCH to ride the portal home ●", W/2, H-26, 15, PAL.cream);
  }
};

const Ending = {
  enter(){ this.t=0; crowdNoise(false); stopDrumRoll(); Music.mute.celebr=false; setTrack("polka"); sfx.portal(); },
  onButton(){ if(this.t>5) Game.setStage(TitleStage); },
  update(dt){ this.t+=dt; },
  draw(){
    const t=this.t, gt=Game.stageT;
    if (t<2.2){
      px(0,0,W,H,PAL.ink);
      drawPortal(W/2,H/2,120+Math.sin(gt*4)*8,gt);
      const p=Math.min(1,t/2);
      drawPerson(W/2, H/2+90-p*30, {scale:3.6*(1-p*0.7), jersey:window.heroJersey||"arg", frame:(gt*8)|0});
      caption2("Through the portal… back home…");
    } else {
      tubingenBackdrop(gt);
      drawPuntBoat(W/2,400,gt,true,true,false,window.heroJersey||"arg");
      bubble(W/2-150,320,"WHERE WERE YOU?!");
      bubble(W/2+90,300,"…long story.");
      bubble(W/2+40,340,"Nice jersey though?!");
      px(0,0,W,70,"rgba(10,16,32,.7)");
      text("PORTAL SOCCER — THE END", W/2, 35, 24, PAL.orange);
      if (t>5 && Math.floor(gt*2)%2===0) text("● PRESS THE SWITCH TO PLAY AGAIN ●", W/2, 500, 16, "#aef2c0");
    }
  }
};

/* ---------------- main loop ---------------- */
let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  Game.update(dt); Game.draw();
  requestAnimationFrame(loop);
}
Game.setStage(TitleStage);
requestAnimationFrame(loop);
</script>
